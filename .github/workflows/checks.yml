name: Part 4.1 checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          npm ci
      - name: Behavioral and FastAPI WebSocket tests
        run: npm test
      - name: Typecheck and build Vue
        run: npm run build
      - name: Initialize and import genuine recording in an isolated database
        env:
          DATABASE_PATH: ./data/ci.sqlite
        run: |
          npm run db:init
          npm run recording:import
